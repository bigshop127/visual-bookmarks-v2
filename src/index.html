<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Visual Bookmarks</title>
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#0f0f17" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="toolbar" id="toolbar">
        <input id="searchInput" type="search" placeholder="搜尋網站、網域..." />
        <label>截圖播放速度 <input id="previewSpeed" type="range" min="8" max="40" step="1" /></label>
      </div>

      <div class="layout-main">
        <div class="drawer-wrapper" id="drawerWrapper">
          <aside class="sidebar">
            <div class="sidebar-title">資料夾</div>
            <ul id="folderList" class="menu-list">
              <li class="active" data-folder="all">全部</li>
            </ul>
            <button id="btnAddCollection" class="btn-add-col">＋ 新增收藏夾</button>
          </aside>

          <aside class="sidebar">
            <div class="sidebar-title">功能</div>
            <ul class="menu-list" id="actionList">
              <li data-action="recent">最近觀看</li>
              <li data-action="favorite">我的最愛</li>
              <li data-action="random">隨機挑選 (5張)</li>
            </ul>
          </aside>

          <div class="drawer-handle" id="drawerHandle">
            <div class="drawer-handle-bar"></div>
          </div>
        </div>

        <main>
          <section id="grid" class="grid"></section>
        </main>
      </div>
    </div>

    <div id="editColModal" class="modal-backdrop" style="display:none">
      <div class="modal-box">
        <div class="modal-header">
          <span>編輯收藏夾</span>
          <button id="editColClose" class="modal-close-btn">✕</button>
        </div>
        <div class="modal-body">
          <div id="editColList" class="edit-col-list"></div>
        </div>
        <div class="modal-footer">
          <button id="editColDone" class="btn-primary">完成</button>
        </div>
      </div>
    </div>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
      }
    </script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
